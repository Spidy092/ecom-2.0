name: Package contract

on:
  pull_request:
    paths:
      - 'packages/storefront-theme/**'
      - 'packages/storefront-core/**'
      - 'tools/release/**'
      - 'release/third-party-assets.json'
      - 'docs/COMMERCIAL-PACKAGE-CONTRACT.md'
      - 'docs/ASSET-LICENSING-GATE.md'
      - 'docs/RELEASE.md'
      - '.wp-env.package.json'
      - '.github/workflows/package-contract.yml'
  push:
    branches:
      - 'agent/grovia-*'
    paths:
      - 'packages/storefront-theme/**'
      - 'packages/storefront-core/**'
      - 'tools/release/**'
      - 'release/third-party-assets.json'
      - '.wp-env.package.json'
      - '.github/workflows/package-contract.yml'

permissions:
  contents: read

jobs:
  build-package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check release-tool syntax
        run: |
          python -m py_compile tools/release/build_packages.py
          python -m py_compile tools/release/verify_asset_inventory.py
          python -m py_compile tools/release/test_asset_inventory.py

      - name: Exercise third-party asset licensing gate
        run: python tools/release/test_asset_inventory.py

      - name: Verify repository asset inventory and generated notices
        run: python tools/release/verify_asset_inventory.py

      - name: Build engineering-alpha artifacts twice
        run: |
          python tools/release/build_packages.py --output artifacts/release-a --source-commit "$GITHUB_SHA"
          python tools/release/build_packages.py --output artifacts/release-b --source-commit "$GITHUB_SHA"

      - name: Verify deterministic artifact hashes and manifest contract
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          first = json.loads(Path('artifacts/release-a/release-manifest.json').read_text())
          second = json.loads(Path('artifacts/release-b/release-manifest.json').read_text())

          assert first['schema'] == 1
          assert first['status'] == 'engineering-alpha'
          assert first['source_commit']
          assert set(first['artifacts']) == {'theme', 'core'}

          for key in ('theme', 'core'):
              a = first['artifacts'][key]
              b = second['artifacts'][key]
              assert a['sha256'] == b['sha256'], (key, a['sha256'], b['sha256'])
              assert a['bytes'] == b['bytes'], (key, a['bytes'], b['bytes'])
              assert len(a['sha256']) == 64
              assert a['bytes'] > 0

              first_zip = Path('artifacts/release-a') / a['filename']
              second_zip = Path('artifacts/release-b') / b['filename']
              assert first_zip.read_bytes() == second_zip.read_bytes(), key

              with zipfile.ZipFile(first_zip) as archive:
                  notice = f"{a['package_root']}/THIRD-PARTY-NOTICES.md"
                  assert notice in archive.namelist(), (key, notice)

          blockers = first['paid_release_blockers']
          assert any('LICENSE' in item for item in blockers)
          assert any('provider' in item for item in blockers)
          assert any('install/activation' in item for item in blockers)
          PY

      - name: Resolve generated package filenames
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/release-a/release-manifest.json').read_text())
          print('THEME_PACKAGE=' + manifest['artifacts']['theme']['filename'])
          print('CORE_PACKAGE=' + manifest['artifacts']['core']['filename'])
          PY

      - name: Start clean pinned WordPress package environment
        run: npx -y @wordpress/env@10.39.0 start --config=.wp-env.package.json

      - name: Install generated Core ZIP through WordPress
        run: |
          npx -y @wordpress/env@10.39.0 --config=.wp-env.package.json run cli wp plugin install "wp-content/package-artifacts/${CORE_PACKAGE}" --activate
          npx -y @wordpress/env@10.39.0 --config=.wp-env.package.json run cli wp plugin status storefront-core

      - name: Install generated Theme ZIP through WordPress
        run: |
          npx -y @wordpress/env@10.39.0 --config=.wp-env.package.json run cli wp theme install "wp-content/package-artifacts/${THEME_PACKAGE}" --activate
          npx -y @wordpress/env@10.39.0 --config=.wp-env.package.json run cli wp theme status storefront-theme

      - name: Verify WooCommerce dependency remains active
        run: npx -y @wordpress/env@10.39.0 --config=.wp-env.package.json run cli wp plugin status woocommerce

      - name: Show package manifest and checksums
        run: |
          cat artifacts/release-a/release-manifest.json
          cat artifacts/release-a/SHA256SUMS

      - name: Stop clean package environment
        if: always()
        run: npx -y @wordpress/env@10.39.0 stop --config=.wp-env.package.json || true
