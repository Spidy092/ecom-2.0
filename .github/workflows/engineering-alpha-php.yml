name: Engineering alpha smoke

on:
  pull_request:
    paths:
      - 'packages/**/*.php'
      - 'packages/**/*.js'
      - 'packages/**/*.json'
      - 'packages/**/*.css'
      - '.github/workflows/engineering-alpha-php.yml'
  push:
    branches:
      - agent/grovia-alpha-skeleton
      - agent/grovia-store-api-slice
    paths:
      - 'packages/**/*.php'
      - 'packages/**/*.js'
      - 'packages/**/*.json'
      - 'packages/**/*.css'
      - '.github/workflows/engineering-alpha-php.yml'

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint package PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -type f -name '*.php' -print)
          if (( ${#files[@]} == 0 )); then
            echo 'No PHP files found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  javascript-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check product workspace JavaScript syntax
        run: |
          node --check packages/storefront-core/assets/js/product-workspace-model.js
          node --check packages/storefront-core/assets/js/product-workspace.js
      - name: Validate block metadata JSON
        run: node -e "JSON.parse(require('fs').readFileSync('packages/storefront-core/blocks/product-workspace/block.json','utf8'))"
      - name: Run product workspace model tests
        run: node --test packages/storefront-core/tests/js/product-workspace-model.test.js
