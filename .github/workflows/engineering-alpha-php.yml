name: Engineering alpha smoke

on:
  pull_request:
    paths:
      - 'packages/**/*.php'
      - 'packages/**/*.js'
      - 'packages/**/*.json'
      - 'packages/**/*.css'
      - 'packages/**/*.py'
      - '.wp-env.json'
      - '.github/workflows/engineering-alpha-php.yml'
  push:
    branches:
      - 'agent/grovia-*'
    paths:
      - 'packages/**/*.php'
      - 'packages/**/*.js'
      - 'packages/**/*.json'
      - 'packages/**/*.css'
      - 'packages/**/*.py'
      - '.wp-env.json'
      - '.github/workflows/engineering-alpha-php.yml'

concurrency:
  group: engineering-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint package PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -type f -name '*.php' -print)
          if (( ${#files[@]} == 0 )); then
            echo 'No PHP files found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  javascript-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check storefront JavaScript syntax
        run: |
          node --check packages/storefront-core/assets/js/product-workspace-model.js
          node --check packages/storefront-core/assets/js/product-workspace.js
          node --check packages/storefront-core/assets/js/saved-products-model.js
      - name: Validate block metadata JSON
        run: node -e "JSON.parse(require('fs').readFileSync('packages/storefront-core/blocks/product-workspace/block.json','utf8'))"
      - name: Run storefront model tests
        run: node --test packages/storefront-core/tests/js/*.test.js

  woo-store-api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Playwright Python library
        run: python -m pip install --disable-pip-version-check playwright==1.62.0
      - name: Verify preinstalled Google Chrome
        run: google-chrome --version
      - name: Start pinned WordPress + WooCommerce environment
        run: npx -y @wordpress/env@10.39.0 start --update
      - name: Activate alpha theme and seed deterministic products
        run: |
          npx -y @wordpress/env@10.39.0 run cli wp plugin status woocommerce
          npx -y @wordpress/env@10.39.0 run cli wp plugin status storefront-core
          npx -y @wordpress/env@10.39.0 run cli wp theme activate storefront-theme
          npx -y @wordpress/env@10.39.0 run cli wp eval-file wp-content/plugins/storefront-core/tests/e2e/seed-products.php
      - name: Exercise real Store API session in Chrome
        run: python packages/storefront-core/tests/e2e/store-api-slice.spec.py
      - name: Exercise Saved auth and ownership boundaries in Chrome
        run: python packages/storefront-core/tests/e2e/saved-products-api.spec.py
      - name: Stop wp-env
        if: always()
        run: npx -y @wordpress/env@10.39.0 stop
