name: Prototype accessibility smoke

on:
  push:
    branches:
      - agent/grovia-foundation
    paths:
      - 'research/prototypes/aisleflow-v0/**'
      - '.agents/skills/webapp-testing/**'
      - '.github/workflows/prototype-accessibility.yml'
  pull_request:
    paths:
      - 'research/prototypes/aisleflow-v0/**'
      - '.github/workflows/prototype-accessibility.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run prototype accessibility smoke checks
        run: python research/prototypes/aisleflow-v0/browser_accessibility_smoke.py
