name: Prototype fixed grocery mission

on:
  push:
    branches:
      - agent/grovia-foundation
    paths:
      - 'research/prototypes/aisleflow-v0/**'
      - '.github/workflows/prototype-mission.yml'
  pull_request:
    paths:
      - 'research/prototypes/aisleflow-v0/**'
      - '.github/workflows/prototype-mission.yml'

permissions:
  contents: read

jobs:
  fixed-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/prototypes/aisleflow-v0/requirements-dev.txt

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/prototypes/aisleflow-v0/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run fixed grocery missions
        run: python research/prototypes/aisleflow-v0/fixed_mission.py

      - name: Upload mission evidence
        uses: actions/upload-artifact@v7
        with:
          name: aisleflow-fixed-mission-${{ github.run_number }}
          path: research/prototypes/aisleflow-v0/fixed-mission-result.json
          if-no-files-found: error
          retention-days: 14
