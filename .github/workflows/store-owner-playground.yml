name: Store-owner Playground smoke

on:
  pull_request:
    paths:
      - 'research/playground/**'
      - '.github/workflows/store-owner-playground.yml'
      - 'packages/storefront-core/**'
      - 'packages/storefront-theme/**'
  push:
    branches:
      - 'agent/grovia-*'
    paths:
      - 'research/playground/**'
      - '.github/workflows/store-owner-playground.yml'
      - 'packages/storefront-core/**'
      - 'packages/storefront-theme/**'

permissions:
  contents: read

jobs:
  disposable-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate Blueprint JSON
        run: node -e "JSON.parse(require('fs').readFileSync('research/playground/store-owner-validation.blueprint.json','utf8'))"

      - name: Verify public Blueprint URL and CORS
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/Spidy092/ecom-2.0/agent/grovia-playground-validation/research/playground/store-owner-validation.blueprint.json'
          curl -fsSL "$url" -o /tmp/public-blueprint.json
          cmp research/playground/store-owner-validation.blueprint.json /tmp/public-blueprint.json
          curl -fsSI "$url" | tr -d '\r' | grep -Ei '^access-control-allow-origin: \*$'

      - name: Install Playwright Python library
        run: python -m pip install --disable-pip-version-check playwright==1.62.0

      - name: Verify preinstalled Google Chrome
        run: google-chrome --version

      - name: Start pinned WordPress Playground CLI
        shell: bash
        run: |
          set -euo pipefail
          npx -y @wp-playground/cli@3.1.48 server \
            --blueprint=research/playground/store-owner-validation.blueprint.json \
            --port=9400 \
            --verbosity=normal \
            > /tmp/store-owner-playground.log 2>&1 &
          echo $! > /tmp/store-owner-playground.pid

          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9400/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" != '1' ]]; then
            cat /tmp/store-owner-playground.log
            echo 'Playground did not become ready.' >&2
            exit 1
          fi

      - name: Exercise tester path in real Chrome
        env:
          BT_PLAYGROUND_BASE_URL: http://127.0.0.1:9400
        run: python research/playground/store-owner-playground.spec.py

      - name: Show Playground log on failure
        if: failure()
        run: cat /tmp/store-owner-playground.log || true

      - name: Stop Playground
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/store-owner-playground.pid ]]; then
            kill "$(cat /tmp/store-owner-playground.pid)" || true
          fi
