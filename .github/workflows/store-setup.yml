name: Store setup smoke

on:
  pull_request:
    paths:
      - 'packages/storefront-core/includes/setup-status.php'
      - 'packages/storefront-core/includes/starter-import-transaction.php'
      - 'packages/storefront-core/includes/starter-preflight.php'
      - 'packages/storefront-core/storefront-core.php'
      - 'packages/storefront-core/tests/e2e/seed-setup-admin.php'
      - 'packages/storefront-core/tests/e2e/setup-status.spec.py'
      - 'packages/storefront-core/tests/e2e/starter-import-transaction.spec.php'
      - 'docs/SETUP-COMPATIBILITY.md'
      - 'docs/STARTER-IMPORT-CONTRACT.md'
      - '.github/workflows/store-setup.yml'
  push:
    branches:
      - 'agent/grovia-*'
    paths:
      - 'packages/storefront-core/includes/setup-status.php'
      - 'packages/storefront-core/includes/starter-import-transaction.php'
      - 'packages/storefront-core/includes/starter-preflight.php'
      - 'packages/storefront-core/storefront-core.php'
      - 'packages/storefront-core/tests/e2e/seed-setup-admin.php'
      - 'packages/storefront-core/tests/e2e/setup-status.spec.py'
      - 'packages/storefront-core/tests/e2e/starter-import-transaction.spec.php'
      - 'docs/SETUP-COMPATIBILITY.md'
      - 'docs/STARTER-IMPORT-CONTRACT.md'
      - '.github/workflows/store-setup.yml'

permissions:
  contents: read

jobs:
  store-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Lint setup PHP
        run: |
          php -l packages/storefront-core/includes/setup-status.php
          php -l packages/storefront-core/includes/starter-import-transaction.php
          php -l packages/storefront-core/includes/starter-preflight.php
          php -l packages/storefront-core/tests/e2e/starter-import-transaction.spec.php
          php -l packages/storefront-core/storefront-core.php
      - name: Install Playwright Python library
        run: python -m pip install --disable-pip-version-check playwright==1.62.0
      - name: Verify preinstalled Google Chrome
        run: google-chrome --version
      - name: Start WordPress + WooCommerce environment
        run: npx -y @wordpress/env@10.39.0 start
      - name: Activate theme and seed setup identities
        run: |
          npx -y @wordpress/env@10.39.0 run cli wp plugin status woocommerce
          npx -y @wordpress/env@10.39.0 run cli wp plugin status storefront-core
          npx -y @wordpress/env@10.39.0 run cli wp theme activate storefront-theme
          npx -y @wordpress/env@10.39.0 run cli wp eval-file wp-content/plugins/storefront-core/tests/e2e/seed-products.php
          npx -y @wordpress/env@10.39.0 run cli wp eval-file wp-content/plugins/storefront-core/tests/e2e/seed-setup-admin.php
      - name: Exercise Store Setup and privacy-safe status export
        run: python packages/storefront-core/tests/e2e/setup-status.spec.py
      - name: Exercise starter import retry/idempotency contract
        run: npx -y @wordpress/env@10.39.0 run cli wp eval-file wp-content/plugins/storefront-core/tests/e2e/starter-import-transaction.spec.php
      - name: Stop wp-env
        if: always()
        run: npx -y @wordpress/env@10.39.0 stop
