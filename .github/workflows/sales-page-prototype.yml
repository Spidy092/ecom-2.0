name: Sales page research smoke

on:
  pull_request:
    paths:
      - 'research/prototypes/sales-page-v0/**'
      - '.github/workflows/sales-page-prototype.yml'
  push:
    branches:
      - agent/grovia-foundation
    paths:
      - 'research/prototypes/sales-page-v0/**'
      - '.github/workflows/sales-page-prototype.yml'

permissions:
  contents: read

jobs:
  message-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/prototypes/sales-page-v0/requirements-dev.txt

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/prototypes/sales-page-v0/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run sales page research smoke checks
        run: python research/prototypes/sales-page-v0/sales_page_smoke.py

      - name: Upload mobile page evidence
        uses: actions/upload-artifact@v7
        with:
          name: sales-page-v0-mobile-${{ github.run_number }}
          path: research/prototypes/sales-page-v0/sales-page-mobile-*.png
          if-no-files-found: error
          retention-days: 14
